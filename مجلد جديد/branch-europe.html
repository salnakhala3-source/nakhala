<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرع أوروبا والمهجر - عائلة النخالة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo"><span>🌿</span> عائلة النخالة العالمية</div>
            <nav><ul><li><a href="index.html">الرئيسية</a></li></ul></nav>
        </div>
    </header>

    <div class="container" style="background: white; padding: 40px; border-radius: 15px; margin-top: 40px; margin-bottom: 40px;">
        <h1 style="color: var(--primary-color); margin-bottom: 20px;">فرع أوروبا والمهجر</h1>
        <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1000&q=80" style="width:100%; height:350px; object-fit:cover; border-radius:10px; margin-bottom:20px;" alt="فرع أوروبا">
        <p style="font-size: 18px; line-height: 1.8; color: #555;">يضم هذا الفرع مجموعات متسعة من الأكاديميين، الأطباء، رجال الأعمال، والشباب الناشطين في دول الاتحاد الأوروبي ودول المهجر الغربي.</p>
        
        <div class="form-section" style="margin-top: 40px;">
            <h3 style="margin-bottom: 20px; color: var(--primary-color);">تسجيل بيانات أفراد فرع أوروبا والمهجر</h3>
            <form onsubmit="event.preventDefault(); alert('تم إرسال بياناتك لفرع أوروبا بنجاح!');">
                <div class="form-group">
                    <label>الاسم الرباعي واللقب:</label>
                    <input type="text" placeholder="الاسم الكامل" required>
                </div>
                <div class="form-group">
                    <label>الدولة الأوروبية / المدينة:</label>
                    <input type="text" placeholder="مثال: ألمانيا - برلين / إستراليا..." required>
                </div>
                <div class="form-group">
                    <label>مجال العمل / الدراسة:</label>
                    <input type="text" placeholder="مثال: هندسة، طب، أعمال حرة..." required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">تسجيل بالفرع</button>
            </form>
        </div>

        <div style="margin-top: 30px;">
            <a href="index.html" class="btn" style="background: #666;">العودة للرئيسية</a>
        </div>
    </div>

    <footer><p>جميع الحقوق محفوظة © 2026 - منصة عائلة النخالة العالمية</p></footer>
</body>
</html>
