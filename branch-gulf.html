<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فرع الخليج العربي - عائلة النخالة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo"><span>🌿</span> عائلة النخال - النخالة في الوطن والشتات</div>
            <nav><ul><li><a href="index.html">الرئيسية</a></li></ul></nav>
        </div>
    </header>

    <div class="container" style="background: white; padding: 40px; border-radius: 15px; margin-top: 40px;">
        <h1 style="color: var(--primary-color); margin-bottom: 20px;">فرع الخليج العربي</h1>
        <p style="font-size: 18px; line-height: 1.8; color: #555;">حضور مهني واقتصادي متميز للكوادر في دول الخليج.</p>
        
        <div class="form-section" style="margin-top: 40px;">
            <h3 style="margin-bottom: 20px; color: var(--primary-color);">تسجيل بيانات فرع الخليج</h3>
            <form id="gulfForm">
                <div class="form-group">
                    <label>الاسم الرباعي واللقب:</label>
                    <input type="text" placeholder="الاسم الكامل" required>
                </div>
                <div class="form-group">
                    <label>الدولة الخليجية:</label>
                    <select required>
                        <option value="">اختر الدولة...</option>
                        <option value="السعودية">المملكة العربية السعودية</option>
                        <option value="الإمارات">الإمارات العربية المتحدة</option>
                        <option value="قطر">دولة قطر</option>
                        <option value="الكويت">دولة الكويت</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" placeholder="+966 / +971..." required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">تسجيل بالفرع</button>
            </form>
        </div>
        <div style="margin-top: 30px;"><a href="index.html" class="btn" style="background: #666;">العودة للرئيسية</a></div>
    </div>
    <footer><p>جميع الحقوق محفوظة © 2026</p></footer>
    <script src="script.js"></script>
</body>
</html>
